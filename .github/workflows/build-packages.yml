name: Build Android & macOS Packages

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================
  # 1. ANDROID APK BUILD
  # ==========================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew android:assembleDebug --stacktrace

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SudokuMaster-Android-APK
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  # ==========================================
  # 2. MACOS APP & DESKTOP BUILD
  # ==========================================
  build-macos:
    name: Build macOS App & Desktop JAR
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Desktop Fat JAR
        run: ./gradlew desktop:dist --stacktrace

      - name: Package Native macOS App (.app bundle)
        run: |
          mkdir -p input_jar
          cp desktop/build/libs/SudokuMaster.jar input_jar/
          
          # Use jpackage to generate self-contained .app bundle with embedded JRE and -XstartOnFirstThread
          jpackage \
            --type app-image \
            --name "SudokuMaster" \
            --input input_jar \
            --main-jar SudokuMaster.jar \
            --main-class org.example.DesktopLauncher \
            --java-options "-XstartOnFirstThread" \
            --dest dist_macos
            
          # Compress .app into zip for clean distribution
          cd dist_macos
          zip -r ../SudokuMaster-macOS-App.zip SudokuMaster.app
          cd ..

      - name: Upload macOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SudokuMaster-macOS-App
          path: SudokuMaster-macOS-App.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload Universal Desktop JAR
        uses: actions/upload-artifact@v4
        with:
          name: SudokuMaster-Universal-Desktop-JAR
          path: desktop/build/libs/SudokuMaster.jar
          if-no-files-found: error
          retention-days: 14
